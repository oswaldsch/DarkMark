<!DOCTYPE html>
<html>
    <head>
        <title>DarkMark: Home</title>
        <link rel="stylesheet" href="style.css">
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
        <script defer src="main.js"></script>
    </head>
    <body>
        <div class="navbar">
            <h1 class="navbar-title">DarkMark</h1>
            <button id="newNoteBtn" class="accent-button" onclick="newNote()">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="File / Note_Edit"> <path id="Vector" d="M10.0002 4H7.2002C6.08009 4 5.51962 4 5.0918 4.21799C4.71547 4.40973 4.40973 4.71547 4.21799 5.0918C4 5.51962 4 6.08009 4 7.2002V16.8002C4 17.9203 4 18.4801 4.21799 18.9079C4.40973 19.2842 4.71547 19.5905 5.0918 19.7822C5.5192 20 6.07899 20 7.19691 20H16.8031C17.921 20 18.48 20 18.9074 19.7822C19.2837 19.5905 19.5905 19.2839 19.7822 18.9076C20 18.4802 20 17.921 20 16.8031V14M16 5L10 11V14H13L19 8M16 5L19 2L22 5L19 8M16 5L19 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" -linejoin="round"></path> </g> </g></svg>
            </button>
        </div>
        <div class="content-container">
            <div class="note-area" id="noteArea">
            </div>
            <div class="note-edit-area" id="noteEditArea">
                <h3 class="placeholder-text">Click a note to show it here</h3>
            </div>
        </div>
        <div id="popoverMenu">
            <button id="copyBtn" onclick="copySelection()"><img src="assets/copy.svg"></button>
            <button id="pasteBtn" onclick="pasteClipboard()"><img src="assets/paste.svg"></button>
            <button id="boldBtn" onclick="formatText('bold')"><img src="assets/bold.svg"></button>
            <button id="italicBtn" onclick="formatText('italic')"><img src="assets/italic.svg"></button>
            <button id="strikethroughBtn" onclick="formatText('strikethrough')"><img src="assets/strikethrough.svg"></button>
            <button id="headingBtn"><img src="assets/heading.svg"></button>
            <div class="dropdown-menu" id="headingMenu">
                <button data-level="1">Heading 1</button>
                <button data-level="2">Heading 2</button>
                <button data-level="3">Heading 3</button>
                <button data-level="4">Heading 4</button>
                <button data-level="5">Heading 5</button>
                <button data-level="6">Heading 6</button>
            </div>
        </div>
        <footer>
            <p>Developed by Oswald Scheuren for <span class="accent-text">YSWS 3am Contest</span></p>
        </footer>
    </body>
</html>
